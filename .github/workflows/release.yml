name: LIVA Release Build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
  schedule:
    # 03:00 UTC Monday = 10:00 VN.
    - cron: '0 3 * * 1'

jobs:
  release-build:
    name: Build & Package Production Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.8
      env:
        SCCACHE_GHA_ENABLED: "true"
        RUSTC_WRAPPER: "sccache"

    - name: Install Dependencies
      run: npm ci

    # Fast verification before expensive compilation
    - name: Validate installer config
      run: npm run check:installer

    - name: Installer config tests
      run: npm run test:installer

    # Cache Cargo registry and git db only. Do NOT cache target folder to prevent cache eviction.
    - name: Cache Cargo Dependencies (release)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-release-

    - name: Install LLVM
      run: choco install llvm -y

    - name: Build native core (release)
      working-directory: liva-native-core
      run: cargo build --release -j 2

    # Verify release binary on a real socket
    - name: E2E gateway over a real socket (release binary)
      run: node scripts/e2e-gateway-ci.mjs --release

    # Build Tauri desktop installer. Note: redundant manual UI build is eliminated
    # because tauri.conf.json already executes "beforeBuildCommand": "npm run build:ui --prefix .."
    - name: Build desktop installer (Tauri)
      run: npx tauri build
      working-directory: liva-desktop

    # Verify installer bundle and calculate SHA-256 checksums
    - name: Verify NSIS installer and generate checksums
      shell: pwsh
      run: |
        $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe -ErrorAction SilentlyContinue
        if (-not $exe) { throw "Không sinh ra bộ cài NSIS nào trong target/release/bundle/nsis/" }
        $msi = Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
        if ($msi) { throw "MSI vẫn được sinh ra — bundle.targets phải là [nsis]" }
        $exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

        # Generate clean SHA-256 checksum manifest for all release artifacts
        New-Item -ItemType Directory -Force -Path target/release/artifacts | Out-Null
        Copy-Item target/release/bundle/nsis/*-setup.exe target/release/artifacts/
        Copy-Item target/release/liva-native-core.exe target/release/artifacts/
        Get-FileHash -Algorithm SHA256 (Get-ChildItem target/release/artifacts/*) | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding utf8 target/release/artifacts/SHA256SUMS.txt
        Write-Host "=== SHA256 CHECKSUMS ==="
        Get-Content target/release/artifacts/SHA256SUMS.txt

    - name: Upload installer bundle (NSIS)
      uses: actions/upload-artifact@v4
      with:
        name: liva-windows-installer
        if-no-files-found: error
        path: |
          target/release/bundle/nsis/*-setup.exe
          target/release/artifacts/SHA256SUMS.txt

    - name: Upload gateway binary (release)
      uses: actions/upload-artifact@v4
      with:
        name: liva-gateway-release
        if-no-files-found: error
        path: target/release/liva-native-core.exe

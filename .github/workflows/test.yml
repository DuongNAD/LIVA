name: LIVA H-MEM Test Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-gateway:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install LLVM
      run: choco install llvm -y

    - name: Run UI Tests
      run: npm run test -w liva-ui

    - name: Run Native Core Tests
      working-directory: liva-native-core
      run: cargo test


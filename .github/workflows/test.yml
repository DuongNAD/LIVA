name: LIVA H-MEM Test Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-gateway:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # docs-check.mjs đối chiếu `git log <commit-trong-front-matter>..HEAD`.
        # Clone nông (mặc định depth=1) không có commit đó nên mọi tài liệu bị
        # báo "không đối chiếu được" và tính năng dò lỗi thời chết trên CI.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # Chỉ dùng thư viện chuẩn của Node — không cần `npm ci`, nên đặt sớm để fail nhanh.
    # Gate: front-matter thiếu/sai, liên kết hỏng, `covers` trỏ tới file không tồn tại,
    # hai tài liệu cùng nhận sở hữu một sự thật. Tài liệu lỗi thời chỉ CẢNH BÁO, không chặn.
    - name: Check Documentation
      run: node scripts/docs-check.mjs

    # Tài liệu LIVA trích dẫn ~2.000 toạ độ `file:dòng`. Mỗi lần mã nguồn dịch
    # chuyển, chúng âm thầm trỏ sai và không có gì báo lỗi. Bước này bắt lỗi
    # CƠ HỌC (file bị xoá/đổi tên, số dòng vượt quá độ dài file); phần ngữ nghĩa
    # — dòng đó có đúng nội dung được nhắc tới không — vẫn phải người đọc.
    # Trích dẫn lịch sử có chủ ý được đánh dấu bằng ~~gạch ngang~~ và bỏ qua.
    - name: Check Documentation Citations
      run: node scripts/docs-citations.mjs

    - name: Install Dependencies
      run: npm ci

    # Runtime dependencies must not contain HIGH/CRITICAL advisories. Tooling-only
    # findings (currently GitNexus native image dependencies) remain visible in
    # the full audit without blocking application delivery.
    - name: Audit Runtime Dependencies
      run: npm audit --omit=dev --audit-level=high

    # Cache Cargo registry + build artifacts. llama.cpp được biên dịch từ C++ và
    # bị ghim opt-level=3 ngay cả ở profile dev, nên build sạch mất rất lâu —
    # đây là khoản tiết kiệm lớn nhất của toàn bộ pipeline.
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Install LLVM
      run: choco install llvm -y

    # Hai gate này pre-commit đã chạy trên file staged, nhưng hook có thể bị
    # bypass (SKIP_AI_HOOK / --no-verify) và chỉ soi file trong commit đó —
    # CI kiểm toàn bộ cây.
    # `vue-tsc -p tsconfig.app.json`, KHÔNG phải `tsc --noEmit`.
    #
    # Hai cái bẫy chồng lên nhau khiến bước này từng xanh mà không kiểm gì:
    #  1. `liva-ui/tsconfig.json` là config kiểu solution — `"files": []` cộng
    #     hai `references`. `tsc --noEmit` với nó duyệt đúng **0 file**
    #     (`tsc --noEmit --listFiles | grep src` = 0). Xanh vĩnh viễn.
    #  2. `tsc` thuần không đọc được SFC, nên kể cả trỏ đúng tsconfig thì
    #     `<script setup>` trong 22 file `.vue` vẫn nằm ngoài tầm kiểm.
    #
    # Khi sửa lại cho đúng, lộ ra 1 lỗi thật (`useVoicePipeline.ts` truyền
    # `Uint8Array<ArrayBufferLike>` vào `WebSocket.send()`).
    - name: TypeScript typecheck
      run: npx vue-tsc --noEmit -p tsconfig.app.json
      working-directory: liva-ui

    - name: ESLint
      run: npx eslint . --max-warnings 0 --no-warn-ignored
      working-directory: liva-ui

    # `test:coverage`, KHÔNG phải `test`. `vitest.config.ts` khai ngưỡng
    # coverage từ lâu, nhưng script `test` là `vitest run` trần nên ngưỡng
    # KHÔNG BAO GIỜ được áp — cổng xanh giả. Bước này chạy `--coverage` để
    # ngưỡng thành gate thật (xem chú thích trong vitest.config.ts).
    - name: Run UI Tests
      run: npm run test:coverage -w liva-ui

    - name: Build Web Clients
      run: |
        npm run build -w liva-ui
        npm run build -w liva-desktop
        npm run build -w liva-mobile-client

    - name: Validate Knowledge Vault
      run: |
        npm run typecheck -w obsidian-llm-wiki
        npm test -w obsidian-llm-wiki

    - name: Run Native Core Tests
      working-directory: liva-native-core
      run: cargo test

    - name: Check Tauri Desktop Integration
      run: cargo check -p liva-desktop

    # Ba module experimental (evolution/, passive/, agent/dispatcher.rs) nằm
    # ngoài build mặc định — chúng chưa nối dây vào đường chạy nào, và hai bộ
    # test của chúng spawn `cargo test` lồng nhau nên tốn ~65s. Chỉ COMPILE-CHECK
    # ở đây để code không mục nát mà không phải trả giá thời gian chạy test.
    - name: Compile-check experimental modules
      working-directory: liva-native-core
      run: cargo check --all-targets --features experimental

    # Clippy là GATE CỨNG từ 22/07/2026 — 0 cảnh báo trên toàn workspace.
    # Hành trình 80 → 35 → 0 cùng ngày:
    #  - 80 → 35: `cargo clippy --fix` (chỉ suggestion machine-applicable).
    #  - 35 → 0: sửa tay — 3 fill-theo-công-thức thành `collect`, 5 vòng DSP
    #    thành zip/slice TƯƠNG ĐƯƠNG CHỨNG MINH ĐƯỢC (denoise/dsp/parakeet/g2p;
    #    riêng g2p còn kiểm bằng hash WAV seed-42 của VieNeu: giống hệt từng
    #    byte trước/sau), 3 type alias, 2 chỗ argon2 dùng struct literal.
    #  - Các `#[allow]` còn lại đều CÓ CHỦ ĐÍCH kèm lý do tại chỗ: `past_len`
    #    trong decode VieNeu (khái niệm KV-cache, không phải biến đếm),
    #    `upsert_vector` 10 tham số (SQL phẳng, struct chỉ thêm nghi lễ),
    #    `result_large_err` ở callback tungstenite (kiểu do thư viện quy định),
    #    `identity_op` cho shape tensor trong denoise.rs.
    #
    # Đo thủ công: `--message-format=short` + grep '": warning:"' — đường dẫn
    # có tiền tố `liva-native-core\src\…` nên `grep '^src/'` luôn ra 0 (bẫy cũ).
    - name: Clippy
      working-directory: liva-native-core
      run: cargo clippy --all-targets -- -D warnings


[package]
name = "liva-rustpotter-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
hound = "3.5"
# rustpotter 3.0.2 was released against candle 0.2.2 and half 2.3.1.
# Newer half releases enable rand 0.9 and no longer compile with candle's rand 0.8 API.
half = "=2.3.1"
rustpotter = { version = "3.0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Production-scale classifier for the short phrase “Hey Liva”.
# Toolchain is pinned by tools/wakeword/toolchain.json.
model_name: wake_liva_en_v2
target_phrases:
  - "hey liva"

# Match the upstream production scale. Do not shrink these values for a model
# that will ship; use a separate untracked config for smoke experiments.
n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 50
tts_backend: piper_vits

# Near-positives must remain negative. These phrases cover the name alone,
# common English confusions and Vietnamese-accent spelling approximations.
custom_negative_phrases:
  - "liva"
  - "lee va"
  - "hey diva"
  - "hey leva"
  - "hey river"
  - "hey lina"
  - "hey linda"
  - "hey lever"
  - "hey leave"
  - "play liva"
  - "they leave"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./tools/wakeword/work/data
output_dir: ./tools/wakeword/work/output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths:
    - ./tools/wakeword/work/data/backgrounds
  rir_paths:
    - ./tools/wakeword/work/data/rirs

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVA Voice Test — Nemotron 3.5 ASR Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a2e;
            --border: #1e1e3a;
            --text-primary: #e4e4f0;
            --text-secondary: #8888a8;
            --text-dim: #555570;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --success: #00d2a0;
            --success-glow: rgba(0, 210, 160, 0.2);
            --warning: #ffc107;
            --error: #ff4757;
            --gradient-start: #6c5ce7;
            --gradient-end: #a29bfe;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── Background Gradient ─── */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(108, 92, 231, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(0, 210, 160, 0.03) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* ─── Header ─── */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .header .subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 400;
        }

        /* ─── Status Bar ─── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 0.8rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 2rem;
            font-size: 0.8rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
            transition: all 0.3s;
        }

        .status-dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success-glow); }
        .status-dot.error { background: var(--error); }
        .status-dot.active { background: var(--warning); animation: pulse-dot 1.5s infinite; }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ─── Mic Button ─── */
        .mic-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--bg-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .mic-btn:hover {
            border-color: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .mic-btn.recording {
            border-color: var(--error);
            background: rgba(255, 71, 87, 0.1);
            animation: mic-pulse 2s infinite;
        }

        .mic-btn.recording .mic-icon { fill: var(--error); }

        @keyframes mic-pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        .mic-icon {
            width: 36px;
            height: 36px;
            fill: var(--text-secondary);
            transition: fill 0.3s;
        }

        .mic-label {
            margin-top: 0.8rem;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        /* ─── Waveform Visualizer ─── */
        .waveform-container {
            width: 100%;
            height: 60px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        .waveform-container canvas {
            width: 100%;
            height: 100%;
        }

        /* ─── Transcript Panel ─── */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1.2rem;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-body {
            padding: 1rem 1.2rem;
            min-height: 80px;
            max-height: 300px;
            overflow-y: auto;
        }

        .panel-body::-webkit-scrollbar { width: 4px; }
        .panel-body::-webkit-scrollbar-track { background: transparent; }
        .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* ─── Transcription Display ─── */
        .transcript-partial {
            color: var(--text-dim);
            font-style: italic;
            font-size: 0.95rem;
            line-height: 1.6;
            transition: color 0.3s;
        }

        .transcript-final {
            color: var(--text-primary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 0.5rem;
            padding: 0.4rem 0.6rem;
            background: rgba(108, 92, 231, 0.05);
            border-left: 2px solid var(--accent);
            border-radius: 0 6px 6px 0;
        }

        .transcript-final .timestamp {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-left: 0.5rem;
        }

        /* ─── AI Response Display ─── */
        .ai-response {
            color: var(--success);
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .ai-response .chunk {
            display: inline;
            animation: fadeIn 0.15s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ─── Log Panel ─── */
        .log-entry {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            padding: 0.15rem 0;
            line-height: 1.5;
        }

        .log-entry.info { color: var(--text-secondary); }
        .log-entry.success { color: var(--success); }
        .log-entry.error { color: var(--error); }
        .log-entry.warning { color: var(--warning); }

        /* ─── Config Bar ─── */
        .config-bar {
            display: flex;
            gap: 1rem;
            align-items: center;
            padding: 0.8rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 1.2rem;
            font-size: 0.8rem;
        }

        .config-bar label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .config-bar input, .config-bar select {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: inherit;
        }

        .config-bar input:focus, .config-bar select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .config-bar button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .config-bar button:hover {
            filter: brightness(1.2);
        }

        .empty-state {
            color: var(--text-dim);
            font-size: 0.85rem;
            font-style: italic;
        }

        /* ─── Text Input ─── */
        .text-input-bar {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .text-input-bar input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.7rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .text-input-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .text-input-bar button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .text-input-bar button:hover { filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎤 LIVA Voice Test</h1>
            <div class="subtitle">Nemotron 3.5 ASR Streaming — CPU ONNX — Zero VRAM</div>
        </div>

        <!-- Config Bar -->
        <div class="config-bar">
            <label>WS Port:</label>
            <input type="number" id="wsPort" value="8082" style="width: 80px;">
            <button onclick="connectWS()">Connect</button>
            <button onclick="disconnectWS()" style="background: var(--error);">Disconnect</button>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="statusWS"></div>
                <span>WebSocket</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="statusMic"></div>
                <span>Microphone</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="statusSTT"></div>
                <span>Nemotron STT</span>
            </div>
        </div>

        <!-- Mic Button -->
        <div class="mic-section">
            <button class="mic-btn" id="micBtn" onclick="toggleMic()">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
            </button>
            <div class="mic-label" id="micLabel">Nhấn để bắt đầu nói</div>
        </div>

        <!-- Waveform -->
        <div class="waveform-container">
            <canvas id="waveform"></canvas>
        </div>

        <!-- Transcription Panel -->
        <div class="panel">
            <div class="panel-header">
                <span>🎤 Nhận dạng giọng nói (STT)</span>
                <span id="sttStatus" style="color: var(--text-dim);">Chờ...</span>
            </div>
            <div class="panel-body" id="transcriptPanel">
                <div class="empty-state">Chưa có transcription. Hãy nói gì đó...</div>
            </div>
        </div>

        <!-- AI Response Panel -->
        <div class="panel">
            <div class="panel-header">
                <span>🤖 LIVA Response</span>
                <span id="aiStatus" style="color: var(--text-dim);">Idle</span>
            </div>
            <div class="panel-body" id="responsePanel">
                <div class="empty-state">Chờ phản hồi từ AI...</div>
            </div>
        </div>

        <!-- Text Input Fallback -->
        <div class="text-input-bar">
            <input type="text" id="textInput" placeholder="Hoặc gõ text ở đây..." onkeydown="if(event.key==='Enter')sendText()">
            <button onclick="sendText()">Gửi</button>
        </div>

        <!-- Log Panel -->
        <div class="panel" style="margin-top: 1rem;">
            <div class="panel-header">
                <span>📋 System Log</span>
                <button onclick="clearLog()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.7rem;">Clear</button>
            </div>
            <div class="panel-body" id="logPanel" style="max-height: 200px;">
            </div>
        </div>
    </div>

    <!-- MsgPack library (for decoding server responses) -->
    <script src="https://cdn.jsdelivr.net/npm/@msgpack/msgpack@3.0.0-beta2/dist.es5+umd/msgpack.min.js"></script>

    <script>
        // ─── State ──────────────────────────────────────────────────
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let analyser = null;
        let isRecording = false;
        let animationId = null;

        const micBtn = document.getElementById('micBtn');
        const micLabel = document.getElementById('micLabel');
        const transcriptPanel = document.getElementById('transcriptPanel');
        const responsePanel = document.getElementById('responsePanel');
        const logPanel = document.getElementById('logPanel');
        const canvas = document.getElementById('waveform');
        const canvasCtx = canvas.getContext('2d');

        // ─── Logging ────────────────────────────────────────────────
        function log(message, level = 'info') {
            const time = new Date().toLocaleTimeString('vi-VN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = `log-entry ${level}`;
            entry.textContent = `[${time}] ${message}`;
            logPanel.appendChild(entry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function clearLog() {
            logPanel.innerHTML = '';
        }

        // ─── Status Indicators ──────────────────────────────────────
        function setStatus(id, state) {
            const dot = document.getElementById(id);
            dot.className = `status-dot ${state}`;
        }

        // ─── WebSocket Connection ───────────────────────────────────
        function connectWS() {
            const port = document.getElementById('wsPort').value || 8082;
            const url = `ws://127.0.0.1:${port}`;

            if (ws && ws.readyState === WebSocket.OPEN) {
                log('Already connected', 'warning');
                return;
            }

            log(`Connecting to ${url}...`);
            ws = new WebSocket(url);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                setStatus('statusWS', 'connected');
                log('✅ WebSocket connected!', 'success');
            };

            ws.onclose = (e) => {
                setStatus('statusWS', '');
                log(`WebSocket disconnected (code: ${e.code})`, 'warning');
            };

            ws.onerror = (e) => {
                setStatus('statusWS', 'error');
                log('❌ WebSocket error', 'error');
            };

            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    handleBinaryMessage(event.data);
                } else {
                    handleTextMessage(event.data);
                }
            };
        }

        function disconnectWS() {
            if (ws) {
                ws.close();
                ws = null;
                setStatus('statusWS', '');
                log('Disconnected', 'info');
            }
        }

        // ─── Handle Incoming Messages ───────────────────────────────
        function handleBinaryMessage(buffer) {
            const view = new Uint8Array(buffer);
            if (view.length === 0) return;

            const type = view[0];
            const payload = view.slice(1);

            if (type === 0x02) {
                // MsgPack event
                try {
                    const decoded = MessagePack.decode(payload);
                    handleEvent(decoded.event, decoded.payload);
                } catch (e) {
                    log(`MsgPack decode error: ${e.message}`, 'error');
                }
            } else if (type === 0x01) {
                // TTS Audio chunk — play it
                playAudioChunk(payload);
            }
        }

        function handleTextMessage(data) {
            try {
                const parsed = JSON.parse(data);
                handleEvent(parsed.event, parsed.payload || parsed);
            } catch {
                log(`Text: ${data.substring(0, 100)}`, 'info');
            }
        }

        let currentAiResponse = '';

        function handleEvent(event, payload) {
            switch (event) {
                case 'ai_thinking_start':
                    document.getElementById('aiStatus').textContent = 'Đang suy nghĩ...';
                    document.getElementById('aiStatus').style.color = 'var(--warning)';
                    log('🧠 AI thinking...', 'info');
                    break;

                case 'ai_thinking_end':
                    document.getElementById('aiStatus').textContent = 'Generating...';
                    break;

                case 'ai_stream_start':
                    currentAiResponse = '';
                    responsePanel.innerHTML = '<div class="ai-response" id="aiResponseText"></div>';
                    document.getElementById('aiStatus').textContent = 'Đang phản hồi...';
                    document.getElementById('aiStatus').style.color = 'var(--success)';
                    log('📝 AI stream started', 'info');
                    break;

                case 'ai_stream_chunk':
                    const chunk = payload?.textChunk || '';
                    if (payload?.isThought) break; // Skip thought chunks
                    currentAiResponse += chunk;
                    const responseEl = document.getElementById('aiResponseText');
                    if (responseEl) {
                        responseEl.textContent = currentAiResponse;
                        responsePanel.scrollTop = responsePanel.scrollHeight;
                    }
                    break;

                case 'ai_stream_reset':
                    currentAiResponse = '';
                    const resetEl = document.getElementById('aiResponseText');
                    if (resetEl) resetEl.textContent = '';
                    break;

                case 'ai_spoken_response':
                    document.getElementById('aiStatus').textContent = 'Hoàn tất';
                    document.getElementById('aiStatus').style.color = 'var(--success)';
                    log(`🔊 Spoken: "${(payload?.text || '').substring(0, 60)}..."`, 'success');
                    break;

                case 'ai_filler_response':
                    log(`🎭 Filler: ${payload?.route || 'thinking'}`, 'info');
                    break;

                case 'audio_ducking':
                    log(`🔉 Audio ducking: ${payload?.volume}`, 'info');
                    break;

                case 'transcription_partial':
                    setStatus('statusSTT', 'active');
                    document.getElementById('sttStatus').textContent = 'Streaming...';
                    document.getElementById('sttStatus').style.color = 'var(--warning)';
                    showPartialTranscript(payload?.text || '');
                    break;

                case 'transcription_ready':
                    finalizaTranscript(payload?.text || '');
                    log(`🎤 Final: "${(payload?.text || '').substring(0, 80)}"`, 'success');
                    break;

                case 'system_notification':
                    log(`📢 ${payload?.message || ''}`, 'warning');
                    break;

                case 'system_busy':
                    log(`⏳ ${payload?.message || 'System busy'}`, 'warning');
                    break;

                default:
                    log(`Event: ${event}`, 'info');
            }
        }

        // ─── Transcript Display ─────────────────────────────────────
        let partialElement = null;

        function showPartialTranscript(text) {
            if (!partialElement) {
                // Remove empty state
                const emptyState = transcriptPanel.querySelector('.empty-state');
                if (emptyState) emptyState.remove();

                partialElement = document.createElement('div');
                partialElement.className = 'transcript-partial';
                transcriptPanel.appendChild(partialElement);
            }
            partialElement.textContent = `🔄 ${text}`;
            transcriptPanel.scrollTop = transcriptPanel.scrollHeight;
        }

        function finalizaTranscript(text) {
            // Remove partial
            if (partialElement) {
                partialElement.remove();
                partialElement = null;
            }

            // Remove empty state
            const emptyState = transcriptPanel.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const time = new Date().toLocaleTimeString('vi-VN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'transcript-final';
            entry.innerHTML = `${text} <span class="timestamp">${time}</span>`;
            transcriptPanel.appendChild(entry);
            transcriptPanel.scrollTop = transcriptPanel.scrollHeight;

            setStatus('statusSTT', 'connected');
            document.getElementById('sttStatus').textContent = 'Ready';
            document.getElementById('sttStatus').style.color = 'var(--success)';
        }

        // ─── Audio Playback (TTS) ───────────────────────────────────
        let ttsAudioContext = null;

        async function playAudioChunk(data) {
            try {
                if (!ttsAudioContext) {
                    ttsAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                // VoiceBinaryProtocol: skip header (opcode 1 byte + seqId 4 bytes = 5 bytes)
                const audioData = data.buffer.slice(data.byteOffset + 5, data.byteOffset + data.byteLength);
                if (audioData.byteLength < 10) return;
                const audioBuffer = await ttsAudioContext.decodeAudioData(audioData.slice(0));
                const source = ttsAudioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(ttsAudioContext.destination);
                source.start();
            } catch {
                // Some chunks may be too small or partial — ignore
            }
        }

        // ─── Microphone ─────────────────────────────────────────────
        async function toggleMic() {
            if (isRecording) {
                stopMic();
            } else {
                await startMic();
            }
        }

        async function startMic() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ Connect WebSocket first!', 'error');
                return;
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000,
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                // ScriptProcessor: 2048 samples = 128ms @ 16kHz (matches Nemotron)
                processor = audioContext.createScriptProcessor(2048, 1, 1);
                source.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    const float32 = new Float32Array(inputData.length);
                    float32.set(inputData);

                    // Send binary: [0x01 header][Float32 PCM data]
                    const buffer = new Uint8Array(1 + float32.byteLength);
                    buffer[0] = 0x01;
                    buffer.set(new Uint8Array(float32.buffer), 1);
                    ws.send(buffer);
                };

                isRecording = true;
                micBtn.classList.add('recording');
                micLabel.textContent = 'Đang ghi... Nhấn để dừng';
                setStatus('statusMic', 'active');
                log('🎤 Microphone started (16kHz, mono, 128ms chunks)', 'success');

                drawWaveform();

            } catch (err) {
                log(`❌ Mic error: ${err.message}`, 'error');
                setStatus('statusMic', 'error');
            }
        }

        function stopMic() {
            isRecording = false;

            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            micBtn.classList.remove('recording');
            micLabel.textContent = 'Nhấn để bắt đầu nói';
            setStatus('statusMic', '');
            log('🎤 Microphone stopped', 'info');

            // Clear waveform
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // ─── Text Input ─────────────────────────────────────────────
        function sendText() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if (!text) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ Connect WebSocket first!', 'error');
                return;
            }

            // Send as user_voice_command event
            ws.send(JSON.stringify({
                event: 'user_voice_command',
                payload: { text }
            }));

            finalizaTranscript(text);
            log(`📤 Sent: "${text}"`, 'success');
            input.value = '';
        }

        // ─── Waveform Visualization ─────────────────────────────────
        function drawWaveform() {
            if (!analyser || !isRecording) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                if (!isRecording) return;
                animationId = requestAnimationFrame(draw);

                analyser.getByteFrequencyData(dataArray);

                const w = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
                const h = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
                canvasCtx.clearRect(0, 0, w, h);

                const barWidth = (w / bufferLength) * 2.5;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * h * 0.8;

                    const gradient = canvasCtx.createLinearGradient(0, h, 0, h - barHeight);
                    gradient.addColorStop(0, 'rgba(108, 92, 231, 0.3)');
                    gradient.addColorStop(1, 'rgba(162, 155, 254, 0.8)');

                    canvasCtx.fillStyle = gradient;
                    canvasCtx.fillRect(x, h - barHeight, barWidth - 1, barHeight);

                    x += barWidth;
                }
            }

            draw();
        }

        // ─── Listen for transcription_ready from CoreKernel ────────
        // The server broadcasts these via MsgPack events
        // We also intercept the audio_input → transcription pipeline

        // Auto-connect on page load
        window.addEventListener('load', () => {
            log('🚀 LIVA Voice Test loaded. Click Connect to start.', 'info');
        });
    </script>
</body>
</html>

[package]
name = "liva-native-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21.0"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.31.0", features = ["bundled", "modern_sqlite", "load_extension"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.24.0"
aes-gcm = "0.10"
hex = "0.4"
bytemuck = "1.16"
bytes = "1.5.0"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
teloxide = { version = "0.13", features = ["macros"] }
reqwest = { version = "0.11", features = ["stream", "multipart"] }
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_ProcessStatus"] }

# ONNX Runtime Rust Bindings for fast CPU-only model execution
ort = { version = "2.0.0-rc.9", features = ["ndarray"] }

# Multi-dimensional tensor handling required by ort
ndarray = "0.15.6"

# Load VieNeu-TTS tied embedding/head weights from the .npz bundle
ndarray-npy = "0.8"

# High-Performance FFT for STT Mel Spectrogram generation
rustfft = "6.2.0"

# Tokenizers for BPE/character decoding and vocabs. 0.21 is needed for VieNeu's
# tokenizer.json (array-format merges + `ignore_merges`, transformers 4.56);
# STT only uses from_file/encode/id_to_token, which are unchanged across the bump.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Native Audio Output and playback mixing
rodio = "0.17.3"

# Fast text normalization and string processing
regex = "1.10.3"

# Base64 decoding for audio chunks
base64 = "0.22.1"

# Safe llama.cpp bindings. `mtmd` enables multimodal (vision) — the Qwen3-VL
# unified-core PoC; the bundled llama.cpp already has the QWEN3VL arch + clip.
llama-cpp-2 = { version = "0.1.151", default-features = false, features = ["mtmd"] }
encoding_rs = "0.8"
xcap = { version = "0.9.6", default-features = false, features = ["wgc"] }

# Pure-Rust WebRTC AEC3 (acoustic echo cancellation) — cancels LIVA's own
# TTS voice bleeding back into the mic during barge-in.
sonora = "0.1"

[features]
default = []
# Ba module chưa nối dây vào bất kỳ đường chạy nào (0 call site ngoài chính
# chúng và test của chúng): evolution/ (self-correction sandbox), passive/
# (hook bàn phím/chuột), agent/dispatcher.rs (swarm). Giữ code lại nhưng LOẠI
# KHỎI BUILD MẶC ĐỊNH — xem docs mục 3.2.
#
# Với passive/ đây còn là quyết định an toàn: nó là keylogger đầy đủ chức năng,
# không nên nằm trong binary giao cho người dùng khi chưa có cổng đồng ý.
#
# Bật để phát triển tiếp: cargo test --features experimental
experimental = []
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
openblas = []

[[bin]]
name = "verify_duplex"
path = "src/bin/verify_duplex.rs"
test = false

[[bin]]
name = "verify_round2"
path = "src/bin/verify_round2.rs"
test = false

[[bin]]
name = "voice_profile"
path = "src/bin/voice_profile.rs"
test = false

[[bin]]
name = "voice_stress"
path = "src/bin/voice_stress.rs"
test = false

[[bin]]
name = "router_stress"
path = "src/bin/router_stress.rs"
test = false

[[bin]]
name = "screen_vision_bench"
path = "src/bin/screen_vision_bench.rs"
test = false

[[bin]]
name = "stt_lang_probe"
path = "src/bin/stt_lang_probe.rs"
test = false

[[bin]]
name = "tts_piper_probe"
path = "src/bin/tts_piper_probe.rs"
test = false

[[bin]]
name = "onnx_probe"
path = "src/bin/onnx_probe.rs"
test = false

[[bin]]
name = "gtcrn_probe"
path = "src/bin/gtcrn_probe.rs"
test = false

[[bin]]
name = "wakeword_probe"
path = "src/bin/wakeword_probe.rs"
test = false

[[bin]]
name = "parakeet_probe"
path = "src/bin/parakeet_probe.rs"
test = false

[[bin]]

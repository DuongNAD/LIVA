<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVA Voice AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">LIVA</div>
            <div class="status-indicator">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </header>

        <main>
            <div class="visualizer-container">
                <div class="orb" id="voice-orb"></div>
                <div class="rings" id="voice-rings"></div>
            </div>
            <div class="controls">
                <button id="connect-btn" class="btn primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                    </svg>
                    Start Listening
                </button>
            </div>
            <p class="transcript" id="transcript">Ready when you are...</p>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>

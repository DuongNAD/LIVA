name: LIVA Test Suite CI (Parallel DAG)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-docs:
    name: Lint & Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # docs-check.mjs matches `git log <commit-in-front-matter>..HEAD`.
        # Shallow clone lacks history, requiring full depth.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check Documentation
      run: node scripts/docs-check.mjs --strict-stale=docs/03-danh-gia

    - name: Check Documentation Citations
      run: node scripts/docs-citations.mjs --max-unchecked=207

    - name: Install Dependencies
      run: npm ci

    - name: Cache actionlint 1.7.12
      uses: actions/cache@v4
      with:
        path: node_modules/.cache/liva-actionlint
        key: ${{ runner.os }}-${{ runner.arch }}-actionlint-1.7.12

    - name: Check AI DevKit Workspace Contract
      run: npm run devkit:lint

    - name: Audit npm Dependencies
      run: npm audit --audit-level=high

    - name: Check Rust Formatting
      run: cargo fmt --all -- --check

    - name: ESLint
      working-directory: liva-ui
      run: npx eslint . --max-warnings 0 --no-warn-ignored

  web-and-ui:
    name: Web & UI Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript typecheck
      working-directory: liva-ui
      run: npx vue-tsc --noEmit -p tsconfig.app.json

    - name: Run UI Tests
      run: npm run test:coverage -w liva-ui

    - name: Build Web Clients
      run: |
        npm run build -w liva-ui
        npm run build -w liva-desktop
        npm run build -w liva-mobile-client

    - name: Validate Knowledge Vault
      run: |
        npm run typecheck -w obsidian-llm-wiki
        npm test -w obsidian-llm-wiki

  rust-check:
    name: Rust Workspace Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-check-

    - name: Install cargo-deny
      uses: taiki-e/install-action@cargo-deny

    - name: Audit Rust Dependencies (cargo-deny)
      run: cargo deny check -W unmaintained -W unsound advisories licenses sources

    - name: Workspace Cargo Check
      run: cargo check --workspace -j 2

    - name: Clippy
      working-directory: liva-native-core
      run: cargo clippy --all-targets -- -D warnings

    - name: Compile-check experimental modules
      working-directory: liva-native-core
      run: cargo check --all-targets --features experimental

  native-core-and-tauri:
    name: Native Core & Tauri Desktop (Windows)
    needs: [lint-and-docs, web-and-ui, rust-check]
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.8
      env:
        SCCACHE_GHA_ENABLED: "true"
        RUSTC_WRAPPER: "sccache"

    - name: Install LLVM
      run: choco install llvm -y

    # Cache Cargo registry and git db only. Do NOT cache entire 10GB target folder to prevent cache eviction.
    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ runner.os }}-cargo-native-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-native-

    - name: Install Dependencies
      run: npm ci

    - name: Build UI Frontend
      run: npm run build -w liva-ui

    - name: Run Native Core Tests
      run: cargo test -p liva-native-core -j 2 -- --test-threads 2

    - name: Test Tauri Desktop Integration
      run: cargo test -p liva-desktop -j 2 -- --test-threads 2

    - name: Check Tauri Desktop Integration
      run: cargo check -p liva-desktop -j 2

    - name: Build gateway binary
      run: cargo build --bin liva-native-core -j 2

    - name: E2E gateway over a real socket (debug)
      run: node scripts/e2e-gateway-ci.mjs

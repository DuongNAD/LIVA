[package]
name = "liva-sherpa-kws-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this sidecar outside LIVA's main Cargo workspace. sherpa-onnx 1.13.4
# uses ORT API 27, while liva-native-core currently embeds ORT API 17.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["shared"] }


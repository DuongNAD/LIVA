[workspace]
members = [
    "liva-desktop/src-tauri",
    "liva-native-core"
]
resolver = "2"

[workspace.dependencies]
# Async Runtime & Concurrency
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21.0"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hyper = { version = "0.14", features = ["server", "http1", "tcp", "stream"] }
reqwest = { version = "0.12", features = ["stream", "multipart"] }
arc-swap = "1.7"

# Serialization & Schemas
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"

# Diagnostics & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Storage & Database
rusqlite = { version = "0.31.0", features = ["backup", "bundled", "modern_sqlite", "load_extension"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.24.0"

# Cryptography & Security
aes-gcm = "0.10"
aes = "0.8"
sha2 = "0.11.0"
hkdf = "0.13.0"
rust-argon2 = "2.1.0"

# Audio & Signal Processing
rodio = "0.17.3"
cpal = "0.15"
sonora = "0.1"

# Machine Learning & Multimodal
ort = { version = "2.0.0-rc.9", features = ["ndarray"] }
ndarray = "0.15.6"
ndarray-npy = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
llama-cpp-2 = { version = "0.1.154", default-features = false, features = ["mtmd"] }

# CLI & Diagnostics Suite
clap = { version = "4.5", features = ["derive"] }

# Utilities & Primitives
bytes = "1.5.0"
bytemuck = "1.16"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.10.3"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows OS APIs
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
] }

# Desktop Shell
tauri = { version = "2", features = ["macos-private-api"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-stronghold = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_bindgen_unstable_test_coverage)'] }

[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"
result_large_err = "allow"
type_complexity = "allow"
collapsible_if = "allow"
await_holding_lock = "allow"

# Production release profile: Maximum optimization with thin LTO, symbol stripping, and abort panic
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Cargo links test binaries under a fresh hash every `cargo test` run and never collects the old
# ones, so full debug info grows target/debug without bound — it reached 149 GB here, 26 GB of that
# .pdb files. Setting debug = 1 (line-tables-only) halts the 94 GB .pdb explosion while preserving backtraces.
[profile.dev]
debug = 1

[profile.dev.package.llama-cpp-2]
opt-level = 3

[profile.dev.package.llama-cpp-sys-2]
opt-level = 3

[profile.dev.package.rust-argon2]
opt-level = 3

# `rust-argon2` delegates its compression primitive to this crate. Optimizing
# only the wrapper leaves the password KDF effectively at debug speed.
[profile.dev.package.blake2b_simd]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

# `artifact_trust` băm SHA-256 TOÀN BỘ file model trước khi cho nạp. Với router
# 4,2 GB (gemma-4-E4B từ 02/08/2026) `sha2` không tối ưu chậm tới mức lõi debug
# KHÔNG nạp xong model trong 400 giây — mọi câu chat trong cửa sổ đó trả về
# "No model loaded", và UI hiện "đã xảy ra lỗi" nên trông y như hỏng thật.
# Đối chiếu: `sha256sum` (C, tối ưu) băm đúng file đó hết 10 giây.
# Cùng lớp vấn đề với `rust-argon2`/`blake2b_simd` ngay trên, chỉ khác là nó
# không lộ ra cho tới khi model đủ to.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.iota-crypto]
opt-level = 3

[profile.dev.package.iota_stronghold]
opt-level = 3

[profile.dev.package.stronghold_engine]
opt-level = 3

[profile.test.package.llama-cpp-2]
opt-level = 3

[profile.test.package.llama-cpp-sys-2]
opt-level = 3

[profile.test.package.rust-argon2]
opt-level = 3

[profile.test.package.regex]
opt-level = 3

[profile.test.package.regex-syntax]
opt-level = 3

[profile.test.package.blake2b_simd]
opt-level = 3

[profile.test.package.aes-gcm]
opt-level = 3

[profile.test.package.aes]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[profile.test.package.iota-crypto]
opt-level = 3

[profile.test.package.iota_stronghold]
opt-level = 3

[profile.test.package.stronghold_engine]
opt-level = 3


[patch.crates-io]
# Local 2.0.1 compatibility fix for Rust E0365; see vendor/proc-macro-error2/LIVA-PATCH.md.
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
# xcb 1.7.0 on crates.io still pins vulnerable quick-xml 0.30. Upstream
# migrated its build parser to quick-xml 0.41 in this signed-off commit.
# Remove this pin after xcb publishes a release containing ae3b2cd.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

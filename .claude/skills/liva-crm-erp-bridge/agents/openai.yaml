  short_description: "Synchronize customer profiles, quotes, and orders across Salesforce, HubSpot, and Odoo"
  default_prompt: "Use $liva-crm-erp-bridge to connect and synchronize customer records, orders, and quotes with enterprise CRM/ERP platforms."
dependencies:

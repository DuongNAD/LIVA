name: LIVA Release Build

# Vì sao có workflow riêng: `test.yml` chưa bao giờ dựng thứ người dùng NHẬN.
# Nó chạy `cargo test` (debug) và `cargo check -p liva-desktop` — không có bước
# nào tạo ra binary release hay bộ cài Tauri. Hai hệ quả:
#
#   1. Gateway release phải được khởi động và kiểm tra qua socket thật. Principal
#      remote cố ý không có quyền gọi `vision:ask`; suy luận vision cần một phiên
#      Tauri đặc quyền cùng model weights và thuộc một gate tích hợp riêng.
#   2. Vỏ Tauri chỉ được compile-check. Đường liên kết, đóng gói, và bundle
#      NSIS/MSI — thứ người dùng thật sự cài — không ai kiểm.
#
# Không gộp vào `test.yml`: build release biên dịch lại llama.cpp từ C++ ở một
# thư mục artifact khác, mất hàng chục phút. Bắt mọi PR trả giá đó sẽ khiến
# người ta tắt CI. Ở đây chạy khi phát hành, khi bấm tay, và MỖI TUẦN MỘT LẦN —
# lịch tuần là để phát hiện mục nát mà không phải chờ tới lúc muốn phát hành.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
  schedule:
    # 03:00 UTC thứ Hai = 10:00 giờ VN.
    - cron: '0 3 * * 1'

jobs:
  release-build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    # Rẻ và đứng trước mọi thứ đắt: bắt cấu hình bộ cài sai (thiếu resource,
    # licenseFile trỏ hụt, WebView2 quay về bản cần mạng, MSI lọt lại vào
    # targets) trong vài giây thay vì sau 20 phút biên dịch llama.cpp.
    - name: Validate installer config
      run: npm run check:installer

    - name: Installer config tests
      run: npm run test:installer

    # Khoá cache TÁCH RIÊNG khỏi test.yml: hai profile sinh ra artifact khác
    # nhau trong cùng `target/`. Dùng chung khoá thì mỗi lần chạy lại ghi đè
    # cache của bên kia và cả hai đều mất tác dụng.
    - name: Cache Cargo (release)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-release-

    - name: Install LLVM
      run: choco install llvm -y

    # `tauri.conf.json` không có `beforeBuildCommand` nên phải dựng frontend
    # trước, bằng tay. `frontendDist` là `../../liva-ui/dist` — hai cấp, vì nó
    # được resolve từ `src-tauri/`. Trước 26/07/2026 nó ghi `../liva-ui/dist`,
    # trỏ vào `liva-desktop/liva-ui/dist` không tồn tại, nên `tauri build` chết
    # ngay ở "Unable to find your web assets" — và không ai biết, vì chưa từng
    # có job nào chạy nó. Đúng khoảng trống mà workflow này sinh ra để đóng.
    - name: Build frontend
      run: npm run build -w liva-ui

    - name: Build native core (release)
      working-directory: liva-native-core
      run: cargo build --release

    # Gate này chứng minh binary release khởi động và thực thi đúng giao thức,
    # origin policy cùng authorization trên socket thật. Principal remote phải
    # bị từ chối `vision:ask`; vì vậy đây không phải bằng chứng suy luận vision.
    # Gate vision đầy đủ cần phiên Tauri đặc quyền và model weights riêng.
    - name: E2E gateway over a real socket (release binary)
      run: node scripts/e2e-gateway-ci.mjs --release

    # Chạy từ `liva-desktop` để CLI tự tìm `src-tauri/tauri.conf.json`.
    # `--no-bundle` KHÔNG dùng: bundle chính là thứ người dùng cài, và cũng là
    # bước duy nhất chứng minh vỏ liên kết + đóng gói được.
    - name: Build desktop installer (Tauri)
      run: npx tauri build
      working-directory: liva-desktop

    # NSIS per-user là bộ cài chính thức DUY NHẤT (`bundle.targets: ["nsis"]`).
    # MSI đã bị bỏ: WiX cài per-machine vào Program Files, một thư mục chỉ đọc,
    # nên bản MSI vừa đòi quyền admin vừa không lưu nổi cấu hình.
    #
    # `if-no-files-found: error` là phần quan trọng nhất của bước này: không có
    # nó, một lần bundle hỏng sẽ đi qua CI dưới dạng artifact RỖNG và chỉ lộ ra
    # khi có người đi tải bản phát hành về.
    - name: Verify NSIS installer exists
      shell: pwsh
      run: |
        $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe -ErrorAction SilentlyContinue
        if (-not $exe) { throw "Không sinh ra bộ cài NSIS nào trong target/release/bundle/nsis/" }
        $msi = Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
        if ($msi) { throw "MSI vẫn được sinh ra — bundle.targets phải là [nsis]" }
        $exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

    - name: Upload installer (NSIS)
      uses: actions/upload-artifact@v4
      with:
        name: liva-windows-installer
        if-no-files-found: error
        path: target/release/bundle/nsis/*-setup.exe

    - name: Upload gateway binary
      uses: actions/upload-artifact@v4
      with:
        name: liva-gateway-release
        if-no-files-found: error
        path: target/release/liva-native-core.exe

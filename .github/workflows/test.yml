name: LIVA H-MEM Test Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-gateway:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # docs-check.mjs đối chiếu `git log <commit-trong-front-matter>..HEAD`.
        # Clone nông (mặc định depth=1) không có commit đó nên mọi tài liệu bị
        # báo "không đối chiếu được" và tính năng dò lỗi thời chết trên CI.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # Chỉ dùng thư viện chuẩn của Node — không cần `npm ci`, nên đặt sớm để fail nhanh.
    # Gate: front-matter thiếu/sai, liên kết hỏng, `covers` trỏ tới file không tồn tại,
    # hai tài liệu cùng nhận sở hữu một sự thật. Tài liệu lỗi thời chỉ CẢNH BÁO, không chặn.
    - name: Check Documentation
      run: node scripts/docs-check.mjs

    # Tài liệu LIVA trích dẫn ~2.000 toạ độ `file:dòng`. Mỗi lần mã nguồn dịch
    # chuyển, chúng âm thầm trỏ sai và không có gì báo lỗi. Bước này bắt lỗi
    # CƠ HỌC (file bị xoá/đổi tên, số dòng vượt quá độ dài file); phần ngữ nghĩa
    # — dòng đó có đúng nội dung được nhắc tới không — vẫn phải người đọc.
    # Trích dẫn lịch sử có chủ ý được đánh dấu bằng ~~gạch ngang~~ và bỏ qua.
    - name: Check Documentation Citations
      run: node scripts/docs-citations.mjs

    - name: Install Dependencies
      run: npm ci

    # Cache Cargo registry + build artifacts. llama.cpp được biên dịch từ C++ và
    # bị ghim opt-level=3 ngay cả ở profile dev, nên build sạch mất rất lâu —
    # đây là khoản tiết kiệm lớn nhất của toàn bộ pipeline.
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Install LLVM
      run: choco install llvm -y

    # Hai gate này pre-commit đã chạy trên file staged, nhưng hook có thể bị
    # bypass (SKIP_AI_HOOK / --no-verify) và chỉ soi file trong commit đó —
    # CI kiểm toàn bộ cây.
    - name: TypeScript typecheck
      run: npx tsc --noEmit
      working-directory: liva-ui

    - name: ESLint
      run: npx eslint . --max-warnings 0 --no-warn-ignored
      working-directory: liva-ui

    - name: Run UI Tests
      run: npm run test -w liva-ui

    - name: Run Native Core Tests
      working-directory: liva-native-core
      run: cargo test

    # Ba module experimental (evolution/, passive/, agent/dispatcher.rs) nằm
    # ngoài build mặc định — chúng chưa nối dây vào đường chạy nào, và hai bộ
    # test của chúng spawn `cargo test` lồng nhau nên tốn ~65s. Chỉ COMPILE-CHECK
    # ở đây để code không mục nát mà không phải trả giá thời gian chạy test.
    - name: Compile-check experimental modules
      working-directory: liva-native-core
      run: cargo check --all-targets --features experimental

    # Clippy is informational for now — **80 warnings** across the crate as of
    # 2026-07-22 (measured with `--all-targets --message-format=short`; note the
    # short format prefixes paths with `liva-native-core\src\…`, so a naive
    # `grep '^src/'` reports zero and is wrong).
    #
    # None of those 80 are in code added during the July 2026 cleanup — those
    # were fixed at the source. The rest are pre-existing and mostly mechanical
    # (`is_multiple_of`, collapsible `if`, needless borrow, too many arguments).
    # Once the count reaches zero, drop `continue-on-error` and add
    # `-- -D warnings` to make this a hard gate.
    - name: Clippy (non-blocking)
      working-directory: liva-native-core
      run: cargo clippy --all-targets
      continue-on-error: true

